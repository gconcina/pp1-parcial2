<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Token CSRF: el JavaScript lo manda en cada POST -->
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Lúmen - Librería &amp; Papelería Técnica{% endblock %}</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  {% block styles %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/parcial2.css') }}">
  {% endblock %}
</head>
<body {% block body_attrs %}class="d-flex flex-column min-vh-100"{% endblock %}>

  {% block body %}
    {% block content %}{% endblock %}
  {% endblock %}

  {% block scripts %}
  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/parcial2.js') }}"></script>
  {% endblock %}

</body>
</html>
